const lessons=[{t:'Pengantar',icon:'📖',h:'Apa Itu Sistem Pencernaan Manusia?',text:'Sistem pencernaan manusia merupakan sistem organ yang mengolah makanan menjadi zat lebih sederhana, sehingga nutrisinya dapat diserap dan digunakan tubuh untuk energi, pertumbuhan, serta perbaikan jaringan.',fact:'Pencernaan sudah dimulai ketika makanan masuk ke mulut, bukan ketika mencapai lambung.'},{t:'Organ Pencernaan',icon:'🫀',h:'Organ-Organ Pencernaan',text:'Saluran pencernaan terdiri dari mulut, kerongkongan, lambung, usus halus, usus besar, rektum, dan anus. Organ aksesori seperti hati, pankreas, kelenjar ludah, dan kantong empedu membantu pencernaan.',fact:'Makanan tidak melewati hati atau pankreas. Keduanya menghasilkan atau menyalurkan zat yang membantu pencernaan.'},{t:'Proses Pencernaan',icon:'⚙️',h:'Mekanik dan Kimiawi',text:'Pencernaan mekanik memecah makanan secara fisik, seperti pengunyahan. Pencernaan kimiawi menggunakan enzim untuk menguraikan molekul makanan menjadi zat yang lebih sederhana.',fact:'Lambung mengaduk makanan secara mekanik sambil mencampurnya dengan cairan lambung.'},{t:'Enzim Pencernaan',icon:'🧬',h:'Enzim yang Membantu Mencerna Makanan',text:'Amilase membantu memecah pati. Pepsin membantu mencerna protein di lambung. Tripsin membantu memecah protein di usus halus. Lipase membantu mencerna lemak.',fact:'Empedu bukan enzim; empedu membantu mengemulsikan lemak supaya lebih mudah dicerna lipase.'},{t:'Penyerapan Nutrisi',icon:'✨',h:'Bagaimana Nutrisi Diserap?',text:'Sebagian besar nutrisi diserap melalui dinding usus halus. Lipatan, vili, dan mikrovili memperluas permukaan penyerapan. Glukosa serta asam amino dapat masuk ke aliran darah.',fact:'Usus halus berperan besar dalam penyerapan nutrisi; usus besar terutama menyerap air dan elektrolit.'},{t:'Gangguan Pencernaan',icon:'⚠️',h:'Gangguan Sistem Pencernaan',text:'Contoh gangguan pencernaan adalah diare, konstipasi, gastritis, dan GERD. Penyebabnya bermacam-macam, termasuk infeksi dan kondisi kesehatan tertentu.',fact:'Diare dapat menyebabkan kehilangan cairan. Gangguan yang berat atau menetap perlu diperiksakan.'},{t:'Menjaga Kesehatan',icon:'💜',h:'Merawat Sistem Pencernaan',text:'Makan beragam dan cukup serat, minum sesuai kebutuhan, menjaga kebersihan makanan, mencuci tangan sebelum makan, dan bergerak aktif dapat mendukung kesehatan sistem pencernaan.',fact:'Kebiasaan sederhana yang dilakukan secara teratur dapat membantu menjaga kesehatan pencernaan.'}];
const stages=[['Mulut','👄','Roti mulai dikunyah','Gigi menghaluskan roti, lidah membantu mencampurkannya dengan air liur. Amilase saliva mulai memecah pati menjadi karbohidrat yang lebih sederhana.'],['Kerongkongan','⬇️','Roti meluncur ke lambung','Roti yang sudah dikunyah membentuk bolus dan didorong menuju lambung melalui gerak peristaltik.'],['Lambung','🫧','Roti diaduk di lambung','Roti diaduk dengan cairan lambung hingga menjadi kimus. Keasaman lambung menghentikan sebagian besar kerja amilase saliva. Pepsin membantu mencerna protein dalam roti.'],['Usus Halus','🧬','Pati diuraikan, glukosa diserap','Amilase pankreas dan enzim seperti maltase melanjutkan pemecahan pati menjadi glukosa. Glukosa kemudian diserap melalui usus halus ke darah.'],['Usus Besar','💧','Sisa makanan diproses','Sebagian komponen roti yang tidak tercerna atau diserap, termasuk sebagian serat, masuk ke usus besar. Air dan elektrolit diserap, sementara bakteri dapat memfermentasi sebagian serat.'],['Rektum','📦','Sisa disimpan sementara','Feses yang terbentuk bergerak menuju rektum, lalu disimpan sementara sebelum dikeluarkan.'],['Anus','🏁','Perjalanan selesai!','Feses dikeluarkan melalui anus. Nutrisi yang telah diserap sebelumnya dapat dimanfaatkan tubuh.']];
const questions=[['Pencernaan kimiawi pati dimulai di ...',['Mulut','Lambung','Rektum'],0],['Organ yang mendorong bolus ke lambung ialah ...',['Pankreas','Kerongkongan','Usus besar'],1],['Pengunyahan termasuk pencernaan ...',['Kimiawi','Mekanik','Penyerapan'],1],['Enzim pepsin mencerna ...',['Protein','Vitamin','Mineral'],0],['Sebagian besar penyerapan nutrisi terjadi di ...',['Lambung','Usus halus','Kerongkongan'],1],['Vili usus berfungsi ...',['Memperluas permukaan penyerapan','Menyimpan feses','Menghasilkan empedu'],0],['Organ penghasil empedu ialah ...',['Hati','Pankreas','Lambung'],0],['Fungsi utama usus besar yaitu ...',['Menghasilkan pepsin','Menyerap air dan elektrolit','Mengunyah makanan'],1],['Kesulitan buang air besar dapat disebut ...',['Diare','Karies','Konstipasi'],2],['Kebiasaan yang mendukung pencernaan sehat yaitu ...',['Cukup serat dan menjaga kebersihan','Jarang minum','Tidak aktif bergerak'],0]];

function materi(){let l=lessons[lesson];return `${header('Materi Sistem Pencernaan','Pilih topik dan pelajari penjelasan singkatnya secara berurutan.') }<div class="twocol"><aside class="sidebar">${lessons.map((a,i)=>`<button class="${i===lesson?'active':''}" onclick="goLesson(${i})">${String(i+1).padStart(2,'0')} &nbsp; ${a.icon} ${a.t}</button>`).join('')}</aside><div class="panel lesson"><span class="badge">MATERI ${String(lesson+1).padStart(2,'0')} / 07</span><div class="diagram"><div class="symbol">${l.icon}</div><div><h3>${l.h}</h3><p>${l.text}</p></div></div><div class="note"><b>💡 Tahukah Kamu?</b><br>${l.fact}</div><div class="btnrow"><button class="secondary" onclick="${lesson===0?"navigate('home')":`goLesson(${lesson-1})`}">← ${lesson===0?'Beranda':'Sebelumnya'}</button><button class="primary" onclick="${lesson===6?"navigate('organ')":`goLesson(${lesson+1})`}">${lesson===6?'Eksplorasi Organ':'Materi Selanjutnya'} →</button></div></div></div>`}
function organ(){const o=[['Mulut','👄','Gigi menghaluskan makanan, lidah membantu mencampurkannya, dan air liur memulai pencernaan pati.'],['Kerongkongan','⬇️','Gerak peristaltik mendorong makanan menuju lambung.'],['Lambung','🫧','Makanan diaduk dengan cairan lambung; pepsin membantu mencerna protein.'],['Usus halus','🧬','Tempat utama pencernaan kimiawi lanjut dan penyerapan nutrisi.'],['Usus besar','💧','Menyerap air dan elektrolit dari sisa makanan.'],['Rektum','📦','Menyimpan feses untuk sementara.'],['Anus','🏁','Jalur keluarnya feses dari tubuh.'],['Hati','🟤','Menghasilkan empedu untuk membantu pencernaan lemak.'],['Pankreas','🧪','Menghasilkan enzim pencernaan dan bikarbonat untuk usus halus.']];return `${header('Peta Organ Pencernaan','Pilih salah satu organ untuk membaca fungsi dan perannya dalam pencernaan.','EKSPLORASI')}<div class="grid">${o.map(x=>card(x[0],x[2],x[1],`showOrgan('${x[0]}')`)).join('')}</div><div id="organDetail"></div>`}function showOrgan(name){const cards=[...document.querySelectorAll('.tile')];let selected=cards.find(x=>x.querySelector('h3')?.textContent===name);const detail=document.getElementById('organDetail');detail.innerHTML=`<div class="panel" style="margin-top:20px"><h3>🔎 ${esc(name)}</h3><p>${selected.querySelector('p').textContent}</p><button class="secondary" onclick="startJourney()">Ikuti Food Journey →</button></div>`;detail.scrollIntoView({behavior:'smooth',block:'nearest'})}
function journey(){let s=stages[step];return `${header('Food Journey: Petualangan Si Roti','Klik Selanjutnya untuk mengikuti perjalanan roti melewati sistem pencernaan.','🍞 MISI MAKANAN')}<div class="panel"><div class="cardline"><span class="badge">Tahap ${step+1} dari 7</span><span class="muted small">${s[0]}</span></div><div class="stepper"><div style="width:${(step+1)/7*100}%"></div></div><div class="twocol" style="grid-template-columns:minmax(170px,1fr) 2fr;align-items:center"><div class="stagepic">${s[1]}</div><div><div class="stagehead">${s[0]}</div><h2 style="font:800 30px Outfit,sans-serif;margin:9px 0">${s[2]}</h2><p style="color:#6e5a79;line-height:1.8">${s[3]}</p><div class="note">🍞 <b>Apa yang terjadi pada roti?</b><br>${s[3]}</div></div></div><div class="btnrow"><button class="secondary" onclick="${step===0?"navigate('home')":"nextStage(-1)"}">← ${step===0?'Beranda':'Kembali'}</button><button class="primary" onclick="${step===6?"navigate('quiz')":"nextStage(1)"}">${step===6?'Lanjut ke Kuis':'Selanjutnya'} →</button></div></div><div class="sectionhead"><h2>Rute Perjalanan</h2></div><div class="path">${stages.map((x,i)=>`<button class="pill" style="${step===i?'background:#f7d8e9;border-color:#d990bf':''}" onclick="step=${i};render()">${i+1}. ${x[0]}</button>`).join('<span style="color:#cda9c5">→</span>')}</div>`}
function parseVideo(v){let text=v.trim();let m=text.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(text)?text:''}function saveVideo(){let id=parseVideo(document.getElementById('yturl').value);if(!id){document.getElementById('vidmsg').textContent='Tautan belum dikenali. Masukkan tautan YouTube lengkap atau ID video 11 karakter.';return}videoId=id;localStorage.setItem('digest_video',id);render()}
function video(){return `${header('Video Pembelajaran','Putar video YouTube di sini tanpa berpindah dari website DIGEST-AI.','🎬 VIDEO')}<div class="panel"><div class="videoArea">${videoId?`<iframe src="https://www.youtube-nocookie.com/embed/${videoId}" title="Video pembelajaran Sistem Pencernaan" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`:`<div><div class="play">▶️</div><h2>Ruang Video DIGEST-AI</h2><p class="muted">Belum ada video yang dipilih. Tempel tautan YouTube kalian di bawah ini untuk menampilkannya di sini.</p></div>`}</div><h3>Tambahkan video dari YouTube</h3><p class="muted small">Contoh tautan: https://www.youtube.com/watch?v=XXXXXXXXXXX. Simpanannya hanya di browser perangkat ini. Untuk website yang dibagikan, isi tautan pada kode situs sebelum dipublikasikan.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="yturl" class="field" style="flex:1;min-width:220px" placeholder="Tempel link YouTube di sini..." value="${videoId?'https://www.youtube.com/watch?v='+videoId:''}"><button class="primary" onclick="saveVideo()">Tampilkan Video</button></div><p id="vidmsg" class="muted small"></p><p>
<a class="link" target="_blank" rel="noopener noreferrer" href="https://youtu.be/tQ46q_7aSzU?si=aGLbonNKyr-tOPvh">Tonton video ini langsung di YouTube ↗</a>
&nbsp; • &nbsp;
<a class="link" target="_blank" rel="noopener noreferrer" href="https://www.youtube.com/results?search_query=sistem+pencernaan+manusia+IPA+SMP">Cari video Sistem Pencernaan lainnya ↗</a>
</p><div class="note"><b>Catatan:</b> Tidak semua pemilik video mengizinkan video disematkan (embed). Jika muncul pesan tidak dapat diputar, gunakan tautan "Tonton di YouTube" atau pilih video yang mengizinkan penyematan.</div></div>`}
function setAnswer(i,j){answers[i]=j}function submitQuiz(){if(Object.keys(answers).length<questions.length){alert('Jawab semua pertanyaan terlebih dahulu.');return}qSubmitted=true;done('quiz');render()}function resetQuiz(){answers={};qSubmitted=false;render()}function quiz(){let score=questions.reduce((n,q,i)=>n+(answers[i]===q[2]?10:0),0);return `${header('Kuis Sistem Pencernaan','Jawab 10 pertanyaan untuk mengetahui pemahamanmu.','✍ EVALUASI')}<div class="panel">${questions.map((q,i)=>`<div class="q"><strong>${i+1}. ${q[0]}</strong>${q[1].map((o,j)=>`<label style="${qSubmitted&&j===q[2]?'border-color:#73bb9c;background:#e9fbf0':''}"><input ${answers[i]===j?'checked':''} ${qSubmitted?'disabled':''} type="radio" name="q${i}" onclick="setAnswer(${i},${j})">${o}</label>`).join('')}${qSubmitted?`<small style="color:#945090">${answers[i]===q[2]?'✅ Benar!':'💡 Jawaban yang benar: '+q[1][q[2]]}</small>`:''}</div>`).join('')}${qSubmitted?`<div class="result"><h2>Skor: ${score}/100</h2><p>${score>=80?'Bagus! Kamu telah memahami sebagian besar materi.':'Pelajari kembali topik yang belum dikuasai, kemudian coba kuis lagi.'}</p></div>`:''}<div class="btnrow"><button class="secondary" onclick="resetQuiz()">Ulangi Kuis</button>${!qSubmitted?'<button class="primary" onclick="submitQuiz()">Periksa Jawaban →</button>':'<button class="primary" onclick="navigate(\'progres\')">Lihat Progres →</button>'}</div></div>`}
function kasus(){const options=['Konstipasi, karena kurang serat, cairan, dan aktivitas gerak dapat berkontribusi pada kesulitan buang air besar.','Karies gigi, karena semua gangguan pencernaan selalu berasal dari gigi.','Diare, karena susah buang air besar pasti akibat infeksi.'];return `${header('Detektif Pencernaan','Ayo analisis masalah sehari-hari dengan pengetahuan sains.','💡 STUDI KASUS')}<div class="panel"><span class="badge">KASUS: ANDI</span><h2>Mengapa Andi sulit buang air besar?</h2><p style="line-height:1.8">Andi sering mengonsumsi makanan rendah serat, kurang minum air, dan jarang bergerak. Beberapa hari terakhir ia kesulitan buang air besar.</p><h3>Menurutmu, penjelasan paling tepat adalah ...</h3>${options.map((o,i)=>`<button class="casechoice" onclick="caseAnswer=${i};if(${i}===0)done('kasus');render()">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}${caseAnswer>=0?`<div class="note"><b>${caseAnswer===0?'✅ Jawaban tepat!':'💡 Coba pikirkan kembali.'}</b><br>Andi kemungkinan mengalami konstipasi. Kurangnya serat, cairan, dan aktivitas fisik dapat berkontribusi. Usus besar berperan dalam penyerapan air dan pembentukan feses.</div>`:''}<div class="btnrow"><button class="secondary" onclick="navigate('materi')">← Kembali ke Materi</button><button class="primary" onclick="navigate('quiz')">Kerjakan Kuis →</button></div></div>`}
function progres(){return `${header('Progres & Evaluasi','Pantau materi yang sudah kamu kunjungi dan aktivitas yang diselesaikan.','📊 HASIL BELAJAR')}<div class="panel"><h3>Perjalanan Belajarmu</h3><div class="progress"><div style="width:${Math.min(100,completed.size/10*100)}%"></div></div><p class="muted">${completed.size} dari 10 aktivitas utama ditandai selesai di browser ini.</p>${lessons.map((l,i)=>`<div class="cardline"><span>${completed.has('lesson'+i)?'✅':'◯'}</span><span>${l.t}</span></div>`).join('')}<div class="cardline">${completed.has('journey')?'✅':'◯'} <span>Food Journey</span></div><div class="cardline">${completed.has('quiz')?'✅':'◯'} <span>Kuis</span></div><div class="cardline">${completed.has('kasus')?'✅':'◯'} <span>Studi Kasus</span></div><div class="note"><b>Refleksi:</b> Materi mana yang paling mudah kamu pahami? Apa yang masih ingin kamu pelajari?</div><p class="small muted">Progres bersifat demonstrasi dan disimpan pada perangkat ini, bukan pada akun siswa.</p><button class="secondary" onclick="if(confirm('Reset progres dan kuis?')){completed=new Set();localStorage.removeItem('digest_done');resetQuiz();navigate('home')}">Reset Progres</button></div>`}
function render(){document.getElementById('nav').innerHTML=menu.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${label}</button>`).join('');app.innerHTML=({home,materi,organ,journey,video,quiz,kasus,progres}[page]||home)()}render();
</script></body></html>
